name: Windows portable release
on:
  push:
    tags: ['v*', '1.*-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pefile==2024.8.26
      - name: Test application
        run: python -m unittest discover -s tests -v
      - name: Download pinned Wireshark binaries and corresponding source
        run: python scripts/fetch_dependencies.py
      - name: Build runtime
        run: python scripts/build_runtime.py --wireshark build/wireshark
      - name: Package ZIP
        run: python scripts/package_portable.py
      - name: Test relocated ZIP
        run: python tests/portable_smoke.py
      - name: Stage source archive
        shell: pwsh
        run: |
          $dependency = (Get-Content -Raw packaging/dependencies.json | ConvertFrom-Json).wireshark
          $sourceName = [System.IO.Path]::GetFileName(([uri]$dependency.source_url).AbsolutePath)
          Copy-Item -LiteralPath (Join-Path build/downloads $sourceName) -Destination dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NetLens-win-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --verify-tag --title "NetLens $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $assets = @(Get-ChildItem -LiteralPath dist -File | Select-Object -ExpandProperty FullName)
          gh release upload "$env:RELEASE_TAG" @assets --clobber
          exit $LASTEXITCODE
